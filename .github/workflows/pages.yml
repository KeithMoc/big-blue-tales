# Publishes the stories to GitHub Pages on every push to main (and by hand from the Actions tab).
# The quick checks run first; a story that fails them is not published. No build step: the site is the files
# themselves, copied into _site without docs/, tools/ and the repo's own notes.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as in GitHub's own starter workflows: the deploy job starts only once the build job has finished, so
  # the uploaded site is listed by then. In one job, deploy looked for the upload 0.3 s after it and found nothing
  # (runs 11 and 12, 2026-11-26).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the stories (sources, tone, recordings, three.js rules)
        run: npm run check
      - name: Gather the site
        run: sh tools/site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
