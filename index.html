<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Blue Tales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  /* layout: the story's 3D picture fills the page; kids get only a caption while a line is spoken, grown-ups a card */
  --abyss: #03070c;      /* open water */
  --panel: #0a151f;      /* card surface */
  --line: #1d3040;       /* hairlines, quiet borders */
  --ink: #e9f1f3;        /* reading text */
  --mute: #93a8b5;       /* labels, secondary text */
  --glow: #7fe4f3;       /* living light: the story's own words */
  --lamp: #ffc45c;       /* warm lamp light: anything you can press */
  --display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* whatever else a rule says about display */
html, body { height: 100%; margin: 0; }
body { background: var(--abyss); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 3px; }
h1, h2, p { margin: 0; }

.app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; height: 100%; }   /* the picture has the whole page: no word panel for kids (only a caption while a line is spoken) */

/* ---------- the picture ---------- */
.stage { container: stage / size; position: relative; min-height: 0; overflow: hidden; background: radial-gradient(120% 90% at 60% 40%, #06121c 0%, var(--abyss) 70%); }
#view, #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#view canvas { touch-action: none; cursor: grab; }
#view canvas:active { cursor: grabbing; }
#view canvas:focus-visible { outline-offset: -5px; }

/* buttons on the picture */

.act { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: 999px; border: 2px solid var(--lamp); background: rgba(3, 7, 12, 0.7); color: var(--lamp); font-weight: 700; }
.act:hover { background: rgba(255, 196, 92, 0.14); }
.act[aria-pressed="true"] { background: var(--lamp); color: #1a1204; }
.act:disabled { opacity: 0.5; cursor: default; }

/* Settings: every part of the screen has its own switch; full screen flips them all at once */
.tools { position: absolute; right: 16px; top: 16px; display: flex; gap: 8px; z-index: 3; }
.tool { min-width: 48px; min-height: 48px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; border: 1px solid var(--line); background: rgba(3, 7, 12, 0.72); color: var(--ink); font-weight: 700; font-size: 15px; }
.moretray { display: contents; } .moretray[hidden] { display: none; }
.tool:hover, .tool[aria-expanded="true"], .tool[aria-pressed="true"] { border-color: var(--lamp); color: var(--lamp); }
.showcard { position: absolute; right: 16px; top: 76px; z-index: 3; width: min(400px, calc(100% - 32px)); max-height: calc(100% - 92px); overflow-y: auto; padding: 14px 16px 16px; border-radius: 16px; border: 1px solid var(--line); display: grid; gap: 12px;
  background: linear-gradient(var(--panel) 40%, transparent) top / 100% 44px no-repeat local, linear-gradient(transparent, var(--panel) 60%) bottom / 100% 44px no-repeat local,
    linear-gradient(rgba(127, 228, 243, 0.45), transparent) top / 100% 14px no-repeat scroll, linear-gradient(transparent, rgba(127, 228, 243, 0.45)) bottom / 100% 14px no-repeat scroll, var(--panel); }
.showcard[hidden] { display: none; }
.showcard h2 { font-family: var(--display); font-size: 21px; font-weight: 700; }
.set { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.set h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--glow); }

.switches { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font-size: 16px; line-height: 1.2; }
.sw:first-child, .sw:nth-child(2) { border-top: 0; }
.sw i { flex: 0 0 auto; width: 46px; height: 26px; border-radius: 13px; background: #23333f; position: relative; transition: background 0.2s; }
.sw i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--mute); transition: translate 0.2s, background 0.2s; }
.sw[aria-checked="true"] i { background: var(--lamp); }
.sw[aria-checked="true"] i::after { translate: 20px 0; background: #1a1204; }


.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--mute); }

.kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--glow); }

.sources { margin-top: auto; font-size: 14px; color: var(--mute); border-top: 1px solid var(--line); padding-top: 14px; }
.sources summary { cursor: pointer; font-weight: 700; }
.sources ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.sources a { color: var(--glow); }
.sources p { margin-top: 12px; }

/* the picture adapts to its own size, wherever the layout puts it */

@container stage (max-width: 640px) {
  .act { padding: 8px 14px; font-size: 15px; }

  .tools { right: 12px; top: 12px; }
  .tool { padding: 0 14px; font-size: 14px; }
  .showcard { right: 12px; top: 68px; width: min(420px, calc(100% - 24px)); max-height: calc(100% - 80px); padding: 12px 14px 14px; gap: 10px; }
  .showcard h2 { font-size: 18px; }
  .switches { column-gap: 16px; }
  .sw { font-size: 14px; line-height: 1.2; gap: 8px; }
  .act .ic { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}


/* ---------- the GPU context was lost: one calm line over the stage ---------- */
.paused { position: absolute; inset: 0; z-index: 4; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center; background: rgba(3, 7, 12, 0.72); font-family: var(--display); font-size: 24px; color: var(--glow); }
.paused[hidden] { display: none; }
.paused button { min-height: 52px; padding: 0 26px; border-radius: 999px; border: 0; background: var(--lamp); color: #1a1204; font: inherit; font-weight: 700; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; background: rgba(3, 7, 12, 0.72); }
.seg button { min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: none; color: var(--mute); font-weight: 700; font-size: 15px; white-space: nowrap; }
.seg button[aria-checked="true"] { background: var(--lamp); color: #1a1204; }

.pill { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(3, 7, 12, 0.72); color: var(--ink); font-weight: 700; font-size: 15px; }
.pill:hover { border-color: var(--lamp); color: var(--lamp); }
.pill[aria-pressed="true"] { background: var(--lamp); color: #1a1204; border-color: var(--lamp); }
.pill i { flex: 0 0 auto; width: 40px; height: 22px; border-radius: 11px; background: #23333f; position: relative; }
.pill i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--mute); transition: translate 0.2s; }
.pill[aria-checked="true"] i { background: var(--lamp); }
.pill[aria-checked="true"] i::after { translate: 18px 0; background: #1a1204; }

@container stage (max-width: 760px) {
  .seg button { padding: 0 11px; font-size: 14px; }

}
@container stage (max-height: 440px) {
  .seg button { padding: 0 9px; font-size: 13px; }

}

/* ---- story mode: a scene on the stage, its buttons over it */
.story { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 80% at 50% 46%, rgba(2,14,28,0) 52%, rgba(2,14,28,.5) 100%); display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 18px 24px; }
.story > * { pointer-events: auto; }
.storyfoot { pointer-events: none; align-self: stretch; display: grid; gap: 8px; margin-top: auto; min-width: 0; }
.storyfoot > * { pointer-events: auto; }
/* Rows wrap instead of scrolling sideways: a phone never cuts a word off at its edge. */
.storyacts, .storyplay { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 2px; min-width: 0; }
.storyplay .seg { flex-wrap: wrap; max-width: 100%; border-radius: 26px; }
/* while Move the view is on, the trail row rests: picking a trail draws again */
.seg.resting button[aria-checked="true"] { background: rgba(255, 196, 92, 0.35); }
.justtray .storyacts { flex-direction: column; align-items: flex-end; }
.storyacts .act { flex: 0 0 auto; min-height: 44px; padding: 8px 16px; font-size: 15px; white-space: nowrap; }
/* With "Words on buttons" off, the story's parts keep their words: they have no picture to show instead. */
.storyplay > * { flex: 0 0 auto; }
/* Just the fish: Play with nothing else on the screen. The water fills the window; one button leads back. */
.just-play .tools, .just-play .storyhead, .just-play .storyfoot, .just-play #storytags { display: none !important; }
.just-play .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
/* The corner, bottom right in every mode: Music, Read aloud and More stacked as round picture buttons (no words:
   ages 5 to 7 know a note and a speaker; each has its name for a screen reader). More opens the tray to its left. */
.corner { position: absolute; right: 16px; bottom: 16px; z-index: 3; display: flex; align-items: flex-end; gap: 8px; max-width: calc(100% - 32px); pointer-events: none; }
.corner > * { pointer-events: auto; }
.cornerbtns { display: grid; gap: 10px; flex: 0 0 auto; }
.cornerbtns[hidden], .round[hidden] { display: none; }
/* the round button is its picture: no frame of its own. On, a thin gold ring; off, grey with a slash across. */
.round { position: relative; width: 56px; height: 56px; padding: 0; display: grid; place-items: center; border-radius: 50%; border: 0; background: none; }
.round .ico { width: 56px; height: 56px; transition: filter 0.2s, opacity 0.2s; }
.round:hover .ico, .round:focus-visible .ico { filter: brightness(1.15); }
.round[aria-checked="true"], .round[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--lamp); }
.round.toggle[aria-checked="false"] .ico { filter: grayscale(1) brightness(0.65); opacity: 0.8; }
.round.toggle[aria-checked="false"]::after { content: ''; position: absolute; left: 50%; top: 50%; width: 64px; height: 5px; border-radius: 3px; background: #e8eef2; box-shadow: 0 0 0 2px rgba(3, 7, 12, 0.85); transform: translate(-50%, -50%) rotate(45deg); pointer-events: none; }
.justtray { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 6px; border-radius: 18px; border: 1px solid var(--line); background: rgba(3, 7, 12, 0.86); min-width: 0; max-width: 100%; max-height: calc(100cqh - 32px); overflow-y: auto; }
.justtray[hidden] { display: none; }
.justtray .seg { padding: 3px; gap: 2px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 100%; border-radius: 22px; }
.justtray .seg::before { content: attr(aria-label); flex: 1 0 100%; padding: 4px 8px 0; text-align: right; font-size: 12px; font-weight: 700; color: var(--mute); }
.justtray .seg button { min-height: 44px; padding: 0 10px; font-size: 13px; }
.justtray .pill { min-height: 44px; padding: 0 14px; font-size: 14px; }
/* The words for kids are spoken, with a caption while they are said: the note line (what is pretend, how to play)
   is read aloud, not left on the screen. It stays for a screen reader. */
#storynote, #storyjustnote { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* A phone, upright or on its side: the choices show their pictures only (each keeps its word as its name for a screen
   reader and as a hint on hover), so no word is ever cut off; the story's name gives the picture its room. */
@container stage (max-width: 560px) {
  .storyfoot .seg:not(.modes) button > span { display: none; }
  .storyfoot .seg:not(.modes) button { min-width: 48px; padding: 0 6px; justify-content: center; }
  .storyfoot .seg:not(.modes) button .ico { margin: 0; }
  .modes button { min-height: 48px; font-size: 16px; padding: 0 14px; }
}
@container stage (max-height: 500px) {
  .storyfoot .seg:not(.modes) button > span { display: none; }
  .storyfoot .seg:not(.modes) button { min-width: 48px; padding: 0 6px; justify-content: center; }
  .storyfoot .seg:not(.modes) button .ico { margin: 0; }
  .storyhead { display: none; }
  .justtray { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .justtray .seg::before { flex: 0 0 auto; padding: 0 4px 0 8px; }
  .justtray .seg { flex-wrap: nowrap; }
  .justtray .seg button > span { display: none; }
  .justtray .seg button { min-width: 44px; padding: 0 4px; justify-content: center; }
  .justtray .seg button .ico { margin: 0; }
  .modes button { min-height: 46px; font-size: 16px; padding: 0 14px; }
  .storyfoot { gap: 6px; }
}
/* the buttons below the picture keep clear of the corner */
.storyfoot { padding-right: 68px; }
@container stage (max-width: 640px) {
  .corner { right: 10px; bottom: 10px; max-width: calc(100% - 20px); }
  .round, .round .ico { width: 50px; height: 50px; } .round.toggle[aria-checked="false"]::after { width: 56px; }
  .storyfoot { padding-right: 58px; }
}
/* a phone on its side: the five round buttons get a little smaller and closer, so they clear Grown-ups at the top */
@container stage (max-height: 500px) {
  .cornerbtns { gap: 6px; }
  .round, .round .ico { width: 44px; height: 44px; } .round.toggle[aria-checked="false"]::after { width: 50px; height: 4px; }
  .storyfoot { padding-right: 52px; }
}
/* Just the fish: only the + until it is pressed; then the corner buttons roll out above it with the tray */
.just-play .corner:not(.open) .cornerbtns > :not(#story-more) { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .just-play .corner.open .cornerbtns > :not(#story-more), .just-play .corner.open .justtray { animation: rollout 0.25s ease-out both; }
  @keyframes rollout { from { opacity: 0; translate: 0 16px; } }
}
/* while the name is in the sky and while the introduction is read, only Music shows in the corner */
.entering .corner, .intro .corner { opacity: 1 !important; pointer-events: none; }
.entering #story-voice, .entering #story-captions, .entering #story-more, .entering #story-home, .entering #story-just, .entering .justtray,
.intro #story-more, .intro #story-home, .intro #story-just, .intro .justtray { display: none; }
.entering .corner .round:not([hidden]), .intro .corner .round:not([hidden]) { pointer-events: auto; }
.justnote { position: absolute; left: 16px; top: 16px; max-width: min(calc(100% - 32px), 420px); animation: justnote 7s ease-in forwards; }
@keyframes justnote { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .justnote { animation: none; } }
.storyplay .pill { min-height: 44px; }
.storynote.caption { justify-self: center; max-width: min(100%, 620px); padding: 10px 20px; font-size: 21px; line-height: 1.35; text-align: center; text-wrap: balance; }
/* The introduction: only the fish and the subtitle, low on the screen and clear of the school. The buttons come in after. */
.intro .tools, .intro .storyhead, .intro #storytags, .intro .storyfoot > :not(.caption) { display: none; }
.intro .storyfoot { margin-bottom: 4vh; }
@media (prefers-reduced-motion: no-preference) {
  .tools, .storyhead, .storyfoot > :not(.caption) { animation: comein 0.8s ease-out; }
  @keyframes comein { from { opacity: 0; } }
}
.storynote { justify-self: start; max-width: min(100%, 520px); padding: 8px 14px; border-radius: 14px; background: rgba(3, 7, 12, 0.86); color: #eaf6fb; font-size: 15px; line-height: 1.35; pointer-events: none; }
.storywhy { pointer-events: auto; display: grid; gap: 6px; justify-items: start; padding: 12px 14px; }
.storywhy .row { display: flex; gap: 8px; } .listen[aria-pressed="true"] { background: #bfe6f5; color: #04121c; }
.storywhy b { font-size: 16px; } .storywhy .because { color: #bfe6f5; } .storywhy .pill { min-height: 36px; padding: 0 14px; font-size: 14px; }
.hide-actions .storyfoot { display: none; }
@container stage (max-width: 640px) { .story { padding: 12px 12px; } .storyacts .act { padding: 6px 12px; font-size: 14px; } .storyplay .seg button { padding: 0 10px; font-size: 14px; min-height: 44px; } .storyplay .pill { padding: 0 12px; font-size: 14px; } .storynote { font-size: 14px; } }
.storyhead { pointer-events: none; margin-top: 60px; text-shadow: 0 1px 10px rgba(2, 10, 20, 0.85), 0 0 3px rgba(2, 10, 20, 0.7); }
.storyhead h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 6cqw, 40px); line-height: 1.05; text-wrap: balance; }
#storytags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.stag { position: absolute; left: 0; top: 0; padding: 3px 10px; border-radius: 999px; background: rgba(3, 7, 12, 0.78); border: 1px solid var(--line); color: var(--ink); font-size: 14px; font-weight: 700; white-space: nowrap; }
.sgroup { display: grid; gap: 8px; }
.sgroup h3 { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); }
.splain { font-size: 15px; line-height: 1.45; color: var(--ink); }
.splain b { color: var(--glow); }
.slink { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; align-items: center; text-align: left; min-height: 56px; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(3, 7, 12, 0.4); color: var(--ink); font-size: 14px; line-height: 1.35; }
.slink:hover { border-color: var(--lamp); }
.slink img { grid-row: 1 / 3; border-radius: 8px; display: block; object-fit: cover; }
.slink b { grid-column: 2; font-size: 16px; color: var(--lamp); }
.slink span { grid-column: 2; color: var(--ink); }
.slink:not(:has(img)) b, .slink:not(:has(img)) span { grid-column: 1 / -1; }

@media (max-width: 860px) and (orientation: portrait) { .storyhead { display: none; } }

/* the story bar: Learn or Play first, then only the buttons of that mode. Music, Find the fish, Settings and Full
   screen are for both modes and sit at the top. */
.storymain { display: grid; gap: 8px; min-width: 0; }
.modes { justify-self: start; padding: 5px; gap: 6px; border: 2px solid var(--line); }
.modes button { min-height: 56px; padding: 0 22px; font-size: 19px; color: var(--ink); }
.modes button[aria-checked="true"] { background: var(--lamp); color: #1a1204; }
.storyfoot .toys { flex-wrap: wrap; overflow: visible; }
.seg button .ico { margin-right: 2px; }
.tool i { flex: 0 0 auto; width: 34px; height: 20px; border-radius: 10px; background: #23333f; position: relative; }
.tool i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--mute); transition: translate 0.2s; }
.tool[aria-checked="true"] i { background: var(--lamp); }
.tool[aria-checked="true"] i::after { translate: 14px 0; background: #1a1204; }
@container stage (max-width: 760px) { .modes button { min-height: 50px; font-size: 17px; padding: 0 16px; } .tools { flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 24px); } }
.showcard .grown ul { display: grid; gap: 6px; padding-left: 18px; font-size: 14px; line-height: 1.4; }
.showcard .grown a { color: var(--glow); }
/* the entry: "Diving in", then the story's name in the sky with a big Start, then a glide down to the fish; the
   buttons come in when it ends. Nothing in it is heavy: it is the story's own sea and sky behind a few words. */
.entry { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; pointer-events: none; }
.entry > * { pointer-events: auto; }
.entry[hidden] { display: none; }
/* Diving in (the concept KM shared, 2026-11-26): light from the surface fading into deep blue, a small school drifting
   across, and three dots for how far the loading is. Plain CSS and one inline SVG, so it shows before anything loads. */
.entryload { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px; overflow: hidden; color: #fff8ea; font-size: clamp(28px, 7cqw, 44px); font-weight: 700;
  background: radial-gradient(120% 60% at 50% -10%, #8fd8ef 0%, #2f93bf 28%, #0d5a8e 55%, #062f58 80%, #031b36 100%); }
.entryload[hidden] { display: none; }
.entryload::before { content: ''; position: absolute; inset: -10% -20% 30%; pointer-events: none; opacity: 0.55; filter: blur(6px);
  background: repeating-linear-gradient(100deg, rgba(255, 255, 255, 0) 0 7%, rgba(220, 246, 255, 0.35) 9%, rgba(255, 255, 255, 0) 12% 18%);
  mask-image: linear-gradient(#000, transparent); -webkit-mask-image: linear-gradient(#000, transparent); animation: shafts 9s ease-in-out infinite alternate; }
@keyframes shafts { from { translate: -3% 0; opacity: 0.4; } to { translate: 3% 0; opacity: 0.65; } }
.loadschool { position: absolute; left: 0; top: 14%; width: clamp(560px, 92vw, 760px); animation: drift 16s linear infinite; }
@keyframes drift { from { translate: -95% 30%; } to { translate: 110vw -25%; } }
.entryload p { position: relative; text-shadow: 0 3px 16px rgba(0, 20, 50, 0.6); }
.loaddots { position: relative; display: flex; gap: 14px; }
.loaddots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #5ec4e6; transition: background 0.3s, border-color 0.3s; }
.entryload[data-step="1"] .loaddots i:nth-child(-n+1), .entryload[data-step="2"] .loaddots i:nth-child(-n+2), .entryload[data-step="3"] .loaddots i { background: var(--lamp); border-color: var(--lamp); }
.entrytitle { display: grid; justify-items: center; gap: 18px; text-align: center; padding: 0 16px; transition: opacity 0.9s, translate 0.9s; }
.entrytitle h1, .entrykicker { animation: entryfloat 5s ease-in-out infinite; }
.entrytitle.going { opacity: 0; translate: 0 -40px; }
@keyframes entryfloat { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }
.entrykicker { font-size: 18px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; text-shadow: 0 2px 12px rgba(0, 20, 50, 0.6); }

.entrygo { border: 0; background: none; padding: 4px; color: #fff; font-size: 28px; font-weight: 700; display: grid; justify-items: center; gap: 10px; text-shadow: 0 2px 10px rgba(0, 20, 50, 0.6); }

.entryplay::before { content: ''; position: absolute; left: 22%; top: 13%; width: 28%; height: 14%; border-radius: 50%; background: rgba(255, 255, 255, 0.45); transform: rotate(-30deg); }
