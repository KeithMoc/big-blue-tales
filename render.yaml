# Render blueprint for the internal demo, before the public launch. A tiny Node server (tools/demo-server.mjs)
# serves the site behind one shared password with strict security headers; Render static sites cannot ask for a
# password. Same build as GitHub Pages: the quick checks first (a story that fails them is not published), then
# only the site files (tools/site.sh). Set DEMO_PASSWORD when Render asks for it.
services:
  - type: web
    runtime: node
    name: big-blue-tales-demo
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm run check && sh tools/site.sh
    startCommand: node tools/demo-server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_PASSWORD
        sync: false
